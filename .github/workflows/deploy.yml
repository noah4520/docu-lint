# 把 VitePress 文件建置後部署到 GitHub Pages
# 參考：
#   VitePress 部署說明 https://vitepress.dev/guide/deploy#github-pages
#   GitHub Pages 自訂 workflow https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
name: Deploy Docs

# 什麼時候執行：push 到 main，或在 Actions 頁面手動執行
on:
  push:
    branches: [main]
  workflow_dispatch:

# 只給部署需要的權限
permissions:
  contents: read # 讀取 repo 的程式碼
  pages: write # 部署到 GitHub Pages
  id-token: write # 部署時驗證身分用的 token

# 同一時間只跑一個部署；新的部署會排隊，不會中斷正在跑的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 建置文件
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v7
      - name: 安裝 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: 安裝套件
        run: npm ci
      - name: 建置文件
        run: npm run docs:build
        env:
          DOCS_BASE: /docu-lint/
      - name: 上傳建置結果
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
